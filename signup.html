<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <body class="bg-[#f2f7ff] text-gray-800">
    <div  class="px-10 py-6">
        <h2 class="text-2xl font-bold mb-6">Sign Up</h2>
        <form>
            <div class="mb-4">
                <label for="fname" class="block text-sm">First Name</label>
                <input type="text" id="fname" name="fname" required class="w-full px-3 py-2 rounded-md bg-transparent border-b border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            <div class="mb-4">
                <label for="lname" class="block text-sm">Last Name</label>
                <input type="text" id="lname" name="lname" required class="w-full px-3 py-2 rounded-md bg-transparent border-b border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-sm">Email</label>
                <input type="email" id="email" name="email" required class="w-full px-3 py-2 rounded-md bg-transparent border-b border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500">
                <div class="error text-red-500" id="emailErr"></div>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm">Password</label>
               <div class="relative">
                     <input type="password" id="password" name="password" required class="w-full px-3 py-2 rounded-md bg-transparent border-b border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500">
                <span class="toggle-password absolute right-0 top-1" data-target="password">
                 <i class="fas fa-eye-slash"></i> <!-- Initial icon: eye-slash (hidden) -->
                </span>
                </div>
                <div class="error text-red-500" id="passwordErr"></div>
            </div>
            <div class="mb-4">
                <label for="pwConfirm" class="block text-sm">Confirm Password</label>
                <div class="relative">
                     <input type="password" id="confirmPassword" name="pwConfirm" required class="w-full px-3 py-2 rounded-md bg-transparent border-b border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500">
                <span class="toggle-password absolute right-0 top-1" data-target="password">
                 <i class="fas fa-eye-slash"></i> <!-- Initial icon: eye-slash (hidden) -->
                </span>
                </div>
                <div class="error text-red-500" id="confirmPasswordErr"></div>
            </div>
            <p class="text-center mt-3 text-sm">Already have an account? <a href="login.html" class="hover:underline font-bold ">Login</a></p>
            <button type="submit" class="cursor-pointer rounded-full border w-full py-3 bg-gradient-to-r from-[#4d8ef7] to-[#619bf8] text-white font-bold my-4">Sign Up</button>
            
        </form>
    </div>
    <script src="scripts/auth.js" type="module"></script>
    <script src="scripts/signup.js" type="module"></script>
</body>
</html>
